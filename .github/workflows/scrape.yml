name: Daily AU PC Part Price Scrape

on:
  schedule:
    # Runs at 20:00 UTC = 06:00 AEST / 07:00 AEDT every day.
    # GitHub's cron scheduler can run a few minutes late during busy periods
    # — that's normal and fine for a daily price check.
    - cron: '0 20 * * *'
  workflow_dispatch: {}   # lets you click "Run workflow" manually in the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the updated prices.json

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        working-directory: option_b_python/scraper
        run: pip install -r requirements.txt

      - name: Install Playwright browser (for Amazon AU)
        working-directory: option_b_python/scraper
        run: playwright install --with-deps chromium

      - name: Run the scraper
        working-directory: option_b_python/scraper
        run: python main.py

      - name: Commit updated price data
        run: |
          git config user.name "price-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add option_b_python/data/prices.json option_b_python/scraper/scrape_errors.log
          git diff --cached --quiet || git commit -m "Automated daily price update"
          git push
